name: Claude PR Review

# Second-reviewer bot: only ever engages with PRs opened by the repo owner. Called as a
# workflow_call step from pr-pipeline.yml, after that orchestrator's `build` and `codeql` jobs have
# both succeeded (enforced there via `needs:`), so ordering and single-run-per-push are structural
# instead of hand-rolled here.

on:
  workflow_call:

permissions: {}

jobs:
  review:
    if: github.event.pull_request.user.login == 'marcintk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # claude-code-action requests an OIDC token to exchange for its scoped GitHub App token; it
      # fails without this.
      id-token: write

    steps:
      # Deliberately does NOT check out the PR's head SHA: this job holds secrets
      # (CLAUDE_CODE_OAUTH_TOKEN) and pull-requests:write. Pinning `ref` to the PR's base branch
      # (rather than omitting it, which under a pull_request-triggered run would resolve to the PR's
      # merge ref) keeps Read/Grep/Glob on trusted content only — Claude reviews the PR's actual
      # diff via `gh pr diff` (one of the fixed `--allowedTools` `gh pr *` subcommands) instead.
      # persist-credentials: false keeps GITHUB_TOKEN out of .git/config, where Read could see it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1
          persist-credentials: false

      # The PR title/body come from the event payload (owner-authored, per the `if:` above) rather
      # than `gh pr view`, which is deliberately not in --allowedTools: without it Claude has no way
      # to pull third-party text (PR comments/reviews) into its context. Title/body go through env,
      # never `${{ }}` inside `run:`, and the output delimiter is random so no body text can end it.
      - name: Load review persona
        id: persona
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          delim="PERSONA_$(openssl rand -hex 16)"
          {
            echo "text<<$delim"
            sed -e "s|{{REPO}}|$REPO|g" -e "s|{{PR_NUMBER}}|$PR_NUMBER|g" .github/claude-pr-review-prompt.md
            printf '\n## PR title and description\n\n### %s\n\n%s\n' "$PR_TITLE" "${PR_BODY:-_(no description)_}"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6 # v1.0.234
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.persona.outputs.text }}
          claude_args: |
            --allowedTools "Read,Grep,Glob,Skill,Agent,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment ${{ github.event.pull_request.number }}:*),Bash(gh pr diff ${{ github.event.pull_request.number }}:*),Bash(gh pr review ${{ github.event.pull_request.number }}:*)"
            --disallowedTools "WebFetch,WebSearch"
