<!doctype html>
<!--
  Standalone rig for scripts/demo/record-demo.mjs — NOT a user-facing page.
  Loads the built bundle from /dist/card.js and mounts the card with a fixed set
  of fake yahoofinance sensor states so the recorder can drive it deterministically.

  Committed on purpose: the demo recipe (scripts/demo/record-demo.json) must be
  reproducible without rebuilding this rig from memory. Never loads real Home
  Assistant data; never writes anything.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>record-harness</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111418;
      }
      #wrap {
        width: 460px;
        /* mimic HA's dark-theme card surface so the recorded frame isn't a bare element */
        --primary-text-color: #e9edf1;
        --secondary-text-color: #9aa4af;
      }
      ha-card,
      #wrap > * {
        background: #1c1f24;
        display: block;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      }
      #wrap > * {
        padding: 5px;
      }
    </style>
    <script type="module" src="/dist/card.js"></script>
  </head>
  <body>
    <div id="wrap"></div>
    <script type="module">
      // ---- fake sensor data -------------------------------------------------
      // Shapes mirror the real `yahoofinance` integration's sensor.yahoofinance_<slug>
      // attributes (src/types.ts YahooFinanceAttributes). Indices/commodities/FX
      // pairs legitimately lack PE/dividend/volume — left undefined, same as real data.
      const a = (o) => ({ attributes: o });

      const states = {
        "sensor.yahoofinance_dji": a({
          marketState: "REGULAR",
          regularMarketPrice: 43250.5,
          regularMarketChangePercent: 0.42,
          fiftyDayAverageChangePercent: 3.1,

        "sensor.yahoofinance_gspc": a({

          fiftyDayAverageChangePercent: 4.2,
          twoHundredDayAverageChangePercent: 11.3,
        }),
        "sensor.yahoofinance_ixic": a({
          marketState: "REGULAR",
          regularMarketPrice: 20250.7,
          regularMarketChangePercent: -0.18,
          fiftyDayAverageChangePercent: 5.5,
          twoHundredDayAverageChangePercent: 14.2,
        }),
        "sensor.yahoofinance_ftse": a({
          marketState: "REGULAR",
          regularMarketPrice: 8395.2,
          regularMarketChangePercent: 0.28,
          fiftyDayAverageChangePercent: 1.6,
          twoHundredDayAverageChangePercent: 6.9,
        }),
        "sensor.yahoofinance_n225": a({
          marketState: "REGULAR",
          regularMarketPrice: 39680.1,
          regularMarketChangePercent: -0.55,
          fiftyDayAverageChangePercent: 2.8,
          twoHundredDayAverageChangePercent: 9.7,
        }),
        "sensor.yahoofinance_gc_f": a({
          marketState: "REGULAR",
          regularMarketPrice: 2650.4,
          regularMarketChangePercent: 0.85,
          fiftyDayAverageChangePercent: 2.1,
          twoHundredDayAverageChangePercent: 18.6,
        }),
        "sensor.yahoofinance_cl_f": a({
          marketState: "REGULAR",
          regularMarketPrice: 71.8,
          regularMarketChangePercent: -1.35,
          fiftyDayAverageChangePercent: -4.2,
          twoHundredDayAverageChangePercent: -6.8,
        }),
        "sensor.yahoofinance_usdpln_x": a({
          marketState: "PRE",
          preMarketPrice: 4.02,
          preMarketChangePercent: -0.15,
          regularMarketPrice: 4.03,
          regularMarketChangePercent: -0.1,
          fiftyDayAverageChangePercent: 0.4,
          twoHundredDayAverageChangePercent: -1.2,
        }),
        "sensor.yahoofinance_usdjpy_x": a({
          marketState: "REGULAR",
          regularMarketPrice: 149.6,
          regularMarketChangePercent: 0.22,
          fiftyDayAverageChangePercent: 1.1,
          twoHundredDayAverageChangePercent: 3.4,
        }),
        "sensor.yahoofinance_dax": a({
          marketState: "REGULAR",
          regularMarketPrice: 19340.6,
          regularMarketChangePercent: 0.38,
          fiftyDayAverageChangePercent: 3.5,
          twoHundredDayAverageChangePercent: 12.1,
        }),
        "sensor.yahoofinance_vix": a({
          marketState: "REGULAR",
          regularMarketPrice: 14.8,
          regularMarketChangePercent: -3.2,
          fiftyDayAverageChangePercent: -6.4,
          twoHundredDayAverageChangePercent: -10.5,
        }),
        "sensor.yahoofinance_aapl": a({
          marketState: "REGULAR",
          regularMarketPrice: 227.5,
          regularMarketChangePercent: 1.2,
          fiftyDayAverageChangePercent: 6.5,
          twoHundredDayAverageChangePercent: 22.4,
          trailingPE: 34.2,
          forwardPE: 29.8,
          dividendRate: 0.96,
          regularMarketVolume: 58_000_000,
        }),
        "sensor.yahoofinance_msft": a({
          marketState: "REGULAR",
          regularMarketPrice: 415.3,
          regularMarketChangePercent: 0.75,
          fiftyDayAverageChangePercent: 4.1,
          twoHundredDayAverageChangePercent: 18.9,
          trailingPE: 36.5,
          forwardPE: 31.2,
          dividendRate: 3.0,
          regularMarketVolume: 21_000_000,
        }),
        "sensor.yahoofinance_nvda": a({
          marketState: "REGULAR",
          regularMarketPrice: 138.2,
          regularMarketChangePercent: 3.8,
          fiftyDayAverageChangePercent: 12.4,
          twoHundredDayAverageChangePercent: 65.2,
          trailingPE: 55.1,
          forwardPE: 42.3,
          dividendRate: 0.04,
          regularMarketVolume: 210_000_000,
        }),
        "sensor.yahoofinance_tsla": a({
          marketState: "POST",
          postMarketPrice: 248.1,
          postMarketChangePercent: -0.65,
          regularMarketPrice: 253.4,
          regularMarketChangePercent: -2.1,
          fiftyDayAverageChangePercent: -8.3,
          twoHundredDayAverageChangePercent: 5.6,
          trailingPE: 68.9,
          forwardPE: 88.2,
          regularMarketVolume: 95_000_000,
        }),
        "sensor.yahoofinance_amzn": a({
          marketState: "REGULAR",
          regularMarketPrice: 231.4,
          regularMarketChangePercent: 0.95,
          fiftyDayAverageChangePercent: 5.8,
          twoHundredDayAverageChangePercent: 19.6,
          trailingPE: 42.1,
          forwardPE: 33.7,
          regularMarketVolume: 34_000_000,
        }),
        "sensor.yahoofinance_googl": a({
          marketState: "REGULAR",
          regularMarketPrice: 198.7,
          regularMarketChangePercent: 1.65,
          fiftyDayAverageChangePercent: 7.2,
          twoHundredDayAverageChangePercent: 24.8,
          trailingPE: 27.4,
          forwardPE: 22.9,
          dividendRate: 0.8,
          regularMarketVolume: 26_000_000,
        }),
        "sensor.yahoofinance_meta": a({
          marketState: "REGULAR",
          regularMarketPrice: 612.9,
          regularMarketChangePercent: -0.42,
          fiftyDayAverageChangePercent: 3.4,
          twoHundredDayAverageChangePercent: 28.1,
          trailingPE: 29.6,
          forwardPE: 25.3,
          dividendRate: 2.0,
          regularMarketVolume: 12_000_000,
        }),
        "sensor.yahoofinance_btc_usd": a({
          marketState: "REGULAR",
          regularMarketPrice: 96500.0,
          regularMarketChangePercent: 2.3,
          fiftyDayAverageChangePercent: 15.6,
          twoHundredDayAverageChangePercent: 48.2,
        }),
        "sensor.yahoofinance_amd": a({
          marketState: "REGULAR",
          regularMarketPrice: 118.6,
          regularMarketChangePercent: -1.85,
          fiftyDayAverageChangePercent: -5.1,
          twoHundredDayAverageChangePercent: 9.3,
          trailingPE: 48.7,
          forwardPE: 24.2,
          regularMarketVolume: 62_000_000,
        }),
        "sensor.yahoofinance_nflx": a({
          marketState: "REGULAR",
          regularMarketPrice: 895.4,
          regularMarketChangePercent: 1.05,
          fiftyDayAverageChangePercent: 8.9,
          twoHundredDayAverageChangePercent: 32.6,
          trailingPE: 44.3,
          forwardPE: 36.1,
          regularMarketVolume: 3_800_000,
        }),
        "sensor.yahoofinance_jpm": a({
          marketState: "REGULAR",
          regularMarketPrice: 246.8,
          regularMarketChangePercent: 0.48,
          fiftyDayAverageChangePercent: 2.9,
          twoHundredDayAverageChangePercent: 21.4,
          trailingPE: 14.6,
          forwardPE: 13.2,
          dividendRate: 4.6,
          regularMarketVolume: 8_900_000,
        }),
      };

      // one shared connection object — the card treats a changed `connection`
      // reference as "reconnected". No `subscribeEvents`, so the card falls back
      // to re-rendering on every `card.hass = …` assignment (see SubscriptionManager).
      const connection = {};
      const makeHass = () => ({ states: { ...states }, connection });

      const card = document.createElement("ha-yahoofinance-board-card");
      card.id = "demo-card";
      card.setConfig({
        prefix: "sensor.yahoofinance_",
        icons: "auto",
        lazy_refresh: 0, // render immediately — no debounce to fight in the recorder
        data_rotate_every: 2, // fast enough to show all 4 data columns on camera
        pinned: [
          { symbol: "dji", name: "DOW JONES" },
          { symbol: "gspc", name: "S&P 500" },
          { symbol: "ixic", name: "NASDAQ" },
          { symbol: "ftse", name: "FTSE 100" },
          { symbol: "n225", name: "Nikkei 225" },
          { symbol: "gc_f", name: "Gold" },
          { symbol: "cl_f", name: "Crude Oil" },
          { symbol: "usdpln_x", name: "USD/PLN" },
          { symbol: "usdjpy_x", name: "USD/JPY" },
          { symbol: "dax", name: "DAX" },
          { symbol: "vix", name: "VIX" },
        ],
        sorted: [
          { symbol: "aapl", name: "Apple" },
          { symbol: "msft", name: "Microsoft" },
          { symbol: "nvda", name: "NVidia", mark: "gold" },
          { symbol: "tsla", name: "Tesla", icon: "★" },
          { symbol: "amzn", name: "Amazon" },
          { symbol: "googl", name: "Alphabet" },
          { symbol: "meta", name: "Meta" },
          { symbol: "btc_usd", name: "Bitcoin" },
          { symbol: "amd", name: "AMD" },
          { symbol: "nflx", name: "Netflix" },
          { symbol: "jpm", name: "JPMorgan" },
        ],
      });
      document.getElementById("wrap").appendChild(card);

      // Real Home Assistant ships an <ha-card> web component whose own shadow DOM
      // sets `:host { display: block }`. There's no HA here, so <ha-card> is an
      // undefined element — `display: inline` — which would leave a collapsed box.
      const haCardFix = document.createElement("style");
      haCardFix.textContent = "ha-card { display: block; }";
      card.shadowRoot.appendChild(haCardFix);

      card.hass = makeHass();

      // A scripted sequence of live-market ticks — each one a partial patch keyed by
      // entity id — so the recorder can call window.__tick(1), __tick(2), … at
      // intervals and the board visibly keeps moving: prices and 1d/50d/200d% drift,
      // the sorted section re-ranks more than once, and one row's market state flips.
      const TICKS = [
        // modest drift across a mix of pinned and sorted rows
        {
          "sensor.yahoofinance_dji": { regularMarketChangePercent: 0.55 },
          "sensor.yahoofinance_gc_f": { regularMarketChangePercent: 1.05, regularMarketPrice: 2658.2 },
          "sensor.yahoofinance_aapl": { regularMarketChangePercent: 1.9, regularMarketPrice: 229.1 },
          "sensor.yahoofinance_nvda": { regularMarketChangePercent: 4.3, regularMarketPrice: 139.6 },
        },
        // AAPL spikes past NVDA (re-sorts the sorted section) and USD/PLN flips
        // PRE -> REGULAR (its price source, prepost background, and name color
        // switch together)
        {
          "sensor.yahoofinance_aapl": { regularMarketChangePercent: 5.4, regularMarketPrice: 233.8 },
          "sensor.yahoofinance_usdpln_x": {
            marketState: "REGULAR",
            regularMarketPrice: 4.04,
            regularMarketChangePercent: 0.5,
          },
          "sensor.yahoofinance_gspc": { regularMarketChangePercent: 0.35 },
        },
        // TSLA drops further, META slides, BTC jumps
        {
          "sensor.yahoofinance_tsla": {
            regularMarketChangePercent: -3.6,
            postMarketChangePercent: -1.4,
            postMarketPrice: 244.9,
          },
          "sensor.yahoofinance_meta": { regularMarketChangePercent: -1.2, regularMarketPrice: 605.1 },
          "sensor.yahoofinance_btc_usd": { regularMarketChangePercent: 4.8, regularMarketPrice: 99850.0 },
        },
        // NVDA regains the lead (re-sorts again), AMD flips positive, VIX spikes
        {
          "sensor.yahoofinance_nvda": { regularMarketChangePercent: 6.9, regularMarketPrice: 143.9 },
          "sensor.yahoofinance_amd": { regularMarketChangePercent: 0.9, regularMarketPrice: 121.4 },
          "sensor.yahoofinance_vix": { regularMarketChangePercent: 8.1, regularMarketPrice: 16.4 },
        },
      ];

      // expose a hook for the recorder: applies TICKS[i - 1] and re-assigns .hass
      window.__tick = (i) => {
        const patch = TICKS[i - 1];
        if (!patch) return;
        for (const [id, attrs] of Object.entries(patch)) {
          states[id] = a({ ...states[id].attributes, ...attrs });
        }
        card.hass = makeHass();
      };

      window.__ready = true;
    </script>
  </body>
</html>
